version: '3.8'

services:
  app:
    build: .
    container_name: uts_trabajos_app
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=uts_trabajos_grado
      - DB_USER=root
      - DB_PASS=secret123
      - DB_SSL=false
    depends_on:
      - db
    restart: always

  db:
    image: mysql:8.0
    container_name: uts_trabajos_db
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: secret123
      MYSQL_DATABASE: uts_trabajos_grado
    ports:
      - "3307:3306"
    volumes:
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - mysql_data:/var/lib/mysql
    restart: always

volumes:
  mysql_data:
